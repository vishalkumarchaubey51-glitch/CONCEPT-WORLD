<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Patna Exhibition Projects - View our complete portfolio of exhibition stall designs and booth fabrications in Patna, Bihar.">
    <meta name="keywords" content="patna exhibition projects, bihar exhibition stalls, exhibition booth patna, stall design portfolio, APICON, Bihar Beauty Expo, Bihar Medical Expo">
    <meta name="author" content="Concept World">
    <meta name="geo.region" content="IN-BR">
    <meta name="geo.placename" content="Patna">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.conceptworld.in/projects.html">
    <meta property="og:title" content="Patna Exhibition Projects - Concept World">
    <meta property="og:description" content="View our complete portfolio of exhibition stall designs in Patna, Bihar.">
    <meta property="og:image" content="https://www.conceptworld.in/image/a1.jpeg">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.conceptworld.in/projects.html">
    
    <title>Patna Exhibition Projects | Exhibition Stall Designs Portfolio | Concept World</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="image/a1.jpeg">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Load Navbar -->
    <script src="assets/js/load-navbar.js"></script>

    <!-- Hero Section -->
    <section class="page-header bg-gradient-primary text-white text-center py-5" style="margin-top: 70px;">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3" data-aos="fade-down">Our Patna Exhibition Projects</h1>
            <p class="lead mb-4" data-aos="fade-up">Showcasing Excellence in Exhibition Stall Design & Fabrication</p>
            <nav aria-label="breadcrumb" data-aos="fade-up">
                <ol class="breadcrumb justify-content-center">
                    <li class="breadcrumb-item"><a href="/" class="text-white">Home</a></li>
                    <li class="breadcrumb-item active text-white-50">Patna Projects</li>
                </ol>
            </nav>
        </div>
    </section>

    <!-- Projects Section -->
    <section class="py-5">
        <div class="container">
            
            <!-- Category Filter -->
            <div class="mb-5" data-aos="fade-up">
                <div class="d-flex flex-wrap gap-2 justify-content-center">
                    <button class="btn btn-sm btn-primary filter-btn" data-filter="all">
                        All Projects
                    </button>
                    <button class="btn btn-sm btn-outline-primary filter-btn" data-filter="Pharmaceutical">
                        Pharmaceutical
                    </button>
                    <button class="btn btn-sm btn-outline-primary filter-btn" data-filter="Medical">
                        Medical
                    </button>
                    <button class="btn btn-sm btn-outline-primary filter-btn" data-filter="Beauty">
                        Beauty
                    </button>
                    <button class="btn btn-sm btn-outline-primary filter-btn" data-filter="Energy">
                        Energy
                    </button>
                </div>
            </div>
            
            <!-- Projects Grid -->
            <div class="row g-4" id="projectsGrid">
                <!-- Projects loaded here via JavaScript -->
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- CTA Section -->
    <section class="py-5 bg-gradient-primary text-white">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8">
                    <h2 class="display-5 fw-bold mb-3">Interested in a Similar Project?</h2>
                    <p class="lead mb-0">Let us create a custom exhibition booth design for your brand.</p>
                </div>
                <div class="col-lg-4 text-lg-end mt-4 mt-lg-0">
                    <a href="/contact.html" class="btn btn-light btn-lg">
                        <i class="fas fa-envelope me-2"></i>Get in Touch
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Load Footer -->
    <script src="assets/js/load-footer.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AOS (Animate On Scroll) -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Projects Data Loader -->
    <script src="assets/js/projects-data.js"></script>

    <!-- Main JS -->
    <script src="assets/js/main.js"></script>

    <!-- Projects Grid JavaScript -->
    <script>
        let allProjects = [];
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', async function() {
            // Load projects
            allProjects = await getAllPatnaProjects();
            renderProjects(allProjects);

            // Setup filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    currentFilter = this.dataset.filter;
                    
                    // Update button states
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('btn-primary');
                        b.classList.add('btn-outline-primary');
                    });
                    this.classList.remove('btn-outline-primary');
                    this.classList.add('btn-primary');

                    // Filter projects
                    if (currentFilter === 'all') {
                        renderProjects(allProjects);
                    } else {
                        const filtered = allProjects.filter(p => p.category.includes(currentFilter));
                        renderProjects(filtered);
                    }
                });
            });
        });

        function renderProjects(projects) {
            const container = document.getElementById('projectsGrid');
            
            if (projects.length === 0) {
                container.innerHTML = '<div class="col-12 text-center"><p class="text-muted">No projects found.</p></div>';
                return;
            }

            const html = projects.map((project, index) => `
                <div class="col-lg-4 col-md-6" data-aos="fade-up" data-aos-delay="${index * 50}">
                    <div class="card border-0 shadow-sm project-card h-100">
                        <div class="position-relative overflow-hidden">
                            <img src="${project.featured_image || project.primary_image}" 
                                 class="card-img-top" 
                                 alt="${project.name}"
                                 style="height: 250px; object-fit: cover;"
                                 onerror="this.src='https://via.placeholder.com/400x250?text=${encodeURIComponent(project.name)}'">
                            <div class="project-overlay">
                                <a href="/project-details.html?slug=${encodeURIComponent(project.slug)}" 
                                   class="btn btn-light btn-sm">
                                    <i class="fas fa-eye me-1"></i> View Details
                                </a>
                            </div>
                            ${project.is_featured ? `<span class="badge bg-warning position-absolute top-0 start-0 m-3">Featured</span>` : ''}
                        </div>
                        <div class="card-body">
                            <span class="badge bg-primary mb-2">${project.category}</span>
                            <h5 class="card-title">${project.name}</h5>
                            <p class="card-text text-muted mb-2">
                                <i class="fas fa-building me-2"></i>
                                <strong>Client:</strong> ${project.client}
                            </p>
                            <p class="card-text text-muted mb-2">
                                <i class="fas fa-calendar-alt me-2"></i>
                                <strong>Event:</strong> ${project.event}
                            </p>
                            <p class="card-text text-muted">${project.description}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
            AOS.refresh();
        }
    </script>

</body>
</html>
